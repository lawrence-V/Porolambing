<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Drawn for 16px, not scaled down from the in-app avatar: no cheeks, one
       solid leaf, heavy outlines, and the mark fills the canvas. A tilted oval
       rather than a circle — a circle at this size just reads as an orange.
       CompanionAvatar keeps the finer drawing; the two intentionally diverge. -->
  <ellipse cx="31" cy="38" rx="21" ry="25" transform="rotate(18 31 38)"
           fill="#f7b32b" stroke="#1d1c1b" stroke-width="5"/>
  <ellipse cx="39" cy="25" rx="7" ry="10" transform="rotate(18 39 25)"
           fill="#e8942a" opacity="0.5"/>
  <path d="M41 12c1-3 1-5 0-7" fill="none" stroke="#1d1c1b" stroke-width="5" stroke-linecap="round"/>
  <path d="M42 6c4-5 11-5 16-2-3 6-11 8-16 2Z"
        fill="#5ea85e" stroke="#1d1c1b" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="23" cy="38" r="4.4" fill="#1d1c1b"/>
  <circle cx="39" cy="38" r="4.4" fill="#1d1c1b"/>
  <path d="M24 47c4.5 5 11 5 15 0" fill="none" stroke="#1d1c1b"
        stroke-width="5" stroke-linecap="round"/>
</svg>
